name: Build

# Every push to main: build a test APK (checks the code compiles and the tests pass).
# Release: change version.txt to a new version (e.g. 1.0.1) and push to main.
# Also works: push a tag like v1.0.1, or run this workflow by hand with a version number.
# A release is signed with your key and attached to a GitHub Release, where the app's
# "Check for update" finds it.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0 (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    # Pinned image: it ships with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        run: |
          curl -sSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Decide version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE_VERSION="$(tr -d ' \r\n' < version.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"; RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] \
               && ! gh release view "v$FILE_VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # version.txt holds a version that hasn't been released yet: release it.
            VERSION="$FILE_VERSION"; RELEASE=true
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"; RELEASE=false
          fi
          if [[ "$RELEASE" == true && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Building version $VERSION (release: $RELEASE)"

      - name: Load signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Turns compile errors into annotations, so they're readable without opening the full log.
      - name: Report build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || { echo "::error::No build log (a setup step failed)"; exit 0; }
          python3 - "$LOG" <<'PY'
          import re, sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          keep = [l for l in lines if re.search(r"^e: |error:|What went wrong|FAILED|Exception|^> |Caused by|expected:<", l)]
          if not keep:
              keep = lines[-60:]
          keep = keep[:150]
          def esc(s): return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for i in range(0, len(keep), 25):
              print("::error title=Build errors part %d::%s" % (i // 25 + 1, esc("\n".join(keep[i:i + 25]))))
          PY

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "listo-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: listo-${{ env.VERSION_NAME }}
          path: listo-*.apk

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "listo-${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "Listo ${VERSION_NAME}" \
            --notes "Open this page on your phone and tap listo-${VERSION_NAME}.apk to install. Already installed? Use ⋮ → Check for update in the app."
