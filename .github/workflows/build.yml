name: Build

# Every push to main: build a test APK (checks the code compiles and the tests pass).
# Release: push a tag like v1.0.0, or run this workflow by hand with a version number.
# A release is signed with your key and attached to a GitHub Release, where the app's
# "Check for update" finds it.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0 (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decide version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"; RELEASE=true
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"; RELEASE=false
          fi
          if [[ "$RELEASE" == true && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Building version $VERSION (release: $RELEASE)"

      - name: Load signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "simple-todo-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: simple-todo-${{ env.VERSION_NAME }}
          path: simple-todo-*.apk

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "simple-todo-${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "Simple Todo ${VERSION_NAME}" \
            --notes "Open this page on your phone and tap simple-todo-${VERSION_NAME}.apk to install. Already installed? Use ⋮ → Check for update in the app."
